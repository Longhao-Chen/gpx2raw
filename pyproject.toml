[project]
name = "gpx2raw"
version = "0.1.0"
description = "Match GPX track points to NEF capture time and write GPS metadata"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gpxpy>=1.6.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
gpx2raw = "gpx2raw.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]